
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Your Account</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 25px 15px;
  background: linear-gradient(135deg, #e0e7ff, #f5e8ff, #dbeafe);
}

.container {
  width: 100%;
  max-width: 470px;
  background: white;
  padding: 35px;
  border-radius: 22px;
  box-shadow: 0 15px 45px rgba(45, 40, 100, 0.15);
}

.logo {
  width: 55px;
  height: 55px;
  background: linear-gradient(135deg, #6366f1, #9333ea);
  color: white;
  display: grid;
  place-items: center;
  border-radius: 16px;
  font-size: 27px;
  margin-bottom: 20px;
}

h1 {
  color: #1e1b4b;
  font-size: 28px;
  margin-bottom: 9px;
}

.subtitle {
  color: #77758b;
  font-size: 14px;
  margin-bottom: 27px;
  line-height: 1.6;
}

.form-group {
  margin-bottom: 17px;
}

label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: #35334b;
  margin-bottom: 8px;
}

input, select {
  width: 100%;
  padding: 13px 14px;
  border: 1px solid #dedeea;
  border-radius: 10px;
  background: #fafaff;
  font-size: 14px;
  color: #292640;
  outline: none;
  transition: 0.2s;
}

input:focus, select:focus {
  border-color: #7c3aed;
  box-shadow: 0 0 0 3px #ede9fe;
  background: white;
}

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.terms {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  margin: 19px 0;
  font-size: 12px;
  color: #66647a;
  line-height: 1.6;
}

.terms input {
  width: 16px;
  height: 16px;
  margin-top: 2px;
  accent-color: #7c3aed;
  flex-shrink: 0;
}

.terms label {
  margin: 0;
  font-weight: normal;
}

.terms a, .footer a {
  color: #7c3aed;
  text-decoration: none;
  font-weight: 600;
}

button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 11px;
  background: linear-gradient(135deg, #6366f1, #9333ea);
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px #7c3aed40;
}

button:active {
  transform: translateY(0);
}

.message {
  display: none;
  padding: 12px;
  margin-top: 16px;
  border-radius: 9px;
  font-size: 13px;
  line-height: 1.5;
}

.message.success {
  display: block;
  color: #166534;
  background: #dcfce7;
}

.message.error {
  display: block;
  color: #991b1b;
  background: #fee2e2;
}

.footer {
  text-align: center;
  margin-top: 23px;
  font-size: 13px;
  color: #77758b;
}

@media (max-width: 420px) {
  .container {
    padding: 25px 20px;
  }
  .row {
    grid-template-columns: 1fr;
    gap: 0;
  }
}
</style>
</head>

<body>

<main class="container">
  <div class="logo" aria-hidden="true">✦</div>

  <h1>Create an account</h1>
  <p class="subtitle">
    Join our community! Fill in your details to get started.
  </p>

  <form id="registrationForm">
    <div class="form-group">
      <label for="fullname">Full Name</label>
      <input id="fullname" name="fullname" type="text"
        placeholder="Enter your full name"
        autocomplete="name" required minlength="2">
    </div>

    <div class="form-group">
      <label for="email">Email Address</label>
      <input id="email" name="email" type="email"
        placeholder="you@example.com"
        autocomplete="email" required>
    </div>

    <div class="form-group">
      <label for="phone">Phone Number</label>
      <input id="phone" name="phone" type="tel"
        placeholder="Enter your phone number"
        autocomplete="tel" required
        pattern="[0-9+() -]{7,20}"
        title="Enter a valid phone number">
    </div>

    <div class="row">
      <div class="form-group">
        <label for="dob">Date of Birth</label>
        <input id="dob" name="dob" type="date" required>
      </div>

      <div class="form-group">
        <label for="gender">Gender</label>
        <select id="gender" name="gender" required>
          <option value="">Select</option>
          <option>Female</option>
          <option>Male</option>
          <option>Prefer not to say</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input id="password" name="password" type="password"
        placeholder="At least 8 characters"
        autocomplete="new-password"
        minlength="8" required>
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirm Password</label>
      <input id="confirmPassword" name="confirmPassword"
        type="password" placeholder="Enter password again"
        autocomplete="new-password" required>
    </div>

    <div class="terms">
      <input id="terms" name="terms" type="checkbox" required>
      <label for="terms">
        I agree to the <a href="#terms">Terms and Conditions</a>
        and confirm that my information is correct.
      </label>
    </div>

    <button type="submit">Create Account →</button>
    <div id="message" class="message" role="status"
      aria-live="polite"></div>
  </form>

  <p class="footer">
    Already have an account? <a href="#login">Sign in</a>
  </p>
</main>

<script>
const form = document.getElementById("registrationForm");
const password = document.getElementById("password");
const confirmPassword = document.getElementById("confirmPassword");
const message = document.getElementById("message");
const dob = document.getElementById("dob");

dob.max = new Date().toISOString().split("T")[0];

form.addEventListener("submit", function(event) {
  event.preventDefault();

  message.className = "message";

  if (new Date(dob.value) > new Date()) {
    message.textContent = "Please enter a valid date of birth.";
    message.classList.add("error");
    return;
  }

  if (password.value !== confirmPassword.value) {
    message.textContent = "Passwords do not match. Please try again.";
    message.classList.add("error");
    confirmPassword.focus();
    return;
  }

  message.textContent =
    "Form validated successfully! This demo does not create an account or save your information.";
  message.classList.add("success");
});
</script>

</body>
</html>
